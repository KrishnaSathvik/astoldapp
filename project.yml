name: Yourly
options:
  bundleIdPrefix: com.astold
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.1.0"
    CURRENT_PROJECT_VERSION: "2"
    GENERATE_INFOPLIST_FILE: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    # Apple Developer team (paid Individual membership). Required for the App Attest entitlement —
    # a free personal team cannot use DeviceCheck/App Attest at all. Must match the TEAMID half of
    # the relay's APP_ATTEST_APP_ID (transcription-service/DEPLOY.md).
    DEVELOPMENT_TEAM: "766WG2GGCA"
    CODE_SIGN_STYLE: Automatic
    # iPhone only (README.md §2, docs/06-tech-stack.md). TARGETED_DEVICE_FAMILY must be set on each
    # target — XcodeGen writes its own "1,2" default per target, which overrides a project-level value.
    SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
    SUPPORTS_MACCATALYST: NO
    # Keep the app off the Mac and Vision Pro stores; both default to YES for iOS apps.
    SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
    SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
targets:
  Yourly:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - App
      - Features
      - Core
      - Models
      - Resources
    # Custom (non-Apple) Info.plist keys cannot be set via INFOPLIST_KEY_* build settings — Xcode
    # only honors that prefix for keys on its own allowlist and silently drops the rest. The relay
    # URL therefore has to live in a real Info.plist; Xcode merges the generated keys into it
    # because GENERATE_INFOPLIST_FILE stays YES. See Core/Voice/TranscriptionConfig.swift.
    info:
      path: App/Info.plist
      properties:
        TranscribeBaseURL: "https://as-told-relay.fly.dev"   # Fly relay (transcription-service/DEPLOY.md)
        # Export compliance. The app uses only exempt cryptography: HTTPS to the relay, CryptoKit's
        # SHA-256 over the App Attest challenge, and DeviceCheck. Declaring it here answers the
        # question once instead of on every App Store Connect upload.
        ITSAppUsesNonExemptEncryption: false
        # XcodeGen otherwise bakes literal defaults here, which would shadow the project-level
        # MARKETING_VERSION / CURRENT_PROJECT_VERSION.
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.astold.app
        INFOPLIST_KEY_CFBundleDisplayName: "As Told"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_NSFaceIDUsageDescription: "Use Face ID to keep your notes private when you reopen the app."
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Record your voice to add a note by speaking."
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        # Portrait only: one column of text, no landscape layouts to review (README.md §2).
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
      configs:
        # App Attest environment must match the relay's APP_ATTEST_PRODUCTION flag.
        Debug:
          CODE_SIGN_ENTITLEMENTS: App/Yourly.Debug.entitlements
        Release:
          CODE_SIGN_ENTITLEMENTS: App/Yourly.Release.entitlements
  YourlyTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - Tests/YourlyTests
    dependencies:
      - target: Yourly
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.astold.tests
        TARGETED_DEVICE_FAMILY: "1"
  YourlyUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - Tests/YourlyUITests
    dependencies:
      - target: Yourly
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.astold.uitests
        TARGETED_DEVICE_FAMILY: "1"
schemes:
  Yourly:
    build:
      targets:
        Yourly: all
    test:
      targets:
        - YourlyTests
        - YourlyUITests
