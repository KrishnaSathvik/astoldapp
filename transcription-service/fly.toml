# Fly.io deployment for the As Told transcription relay.
# The app name must be unique across Fly; change it if `fly launch` reports a collision.
app = "as-told-relay"
primary_region = "ord"   # Chicago. Use `fly platform regions` to pick one nearer your users.

[build]
  dockerfile = "Dockerfile"

# Non-secret configuration only. OPENAI_API_KEY and APP_ATTEST_APP_ID are set with
# `fly secrets set` so they never land in this file or the image (RULES.md §3).
[env]
  NODE_ENV = "production"
  PORT = "8787"
  # Start deliberately low while testing; raise once real usage is understood.
  RATE_LIMIT_MAX = "5"
  RATE_LIMIT_WINDOW_SECONDS = "60"
  # The authoritative cost bound on a single request. The byte cap does NOT bound minutes — 25 MB of
  # low-bitrate AAC is hours of audio — and OpenAI bills per minute, so this is what caps the spend.
  # Measured server-side from the container, before the paid call (src/media/audioDuration.ts).
  MAX_DURATION_SECONDS = "300"
  MONTHLY_VOICE_SECONDS = "3600"
  MAX_AUDIO_BYTES = "26214400"
  # Attestation is REQUIRED. APP_ATTEST_ALLOW_UNPROTECTED is deliberately absent: with it gone,
  # `loadConfig` refuses to boot a production relay that has attestation off, so an open paid
  # endpoint becomes a startup failure rather than a silent risk. Do not re-add it.
  APP_ATTEST_REQUIRED = "true"
  # Must match the entitlement the installed build is signed with:
  #   "false" → App/Yourly.Debug.entitlements   (development AAGUID, "appattestdevelop")
  #   "true"  → App/Yourly.Release.entitlements (production AAGUID, "appattest")
  # DEPLOY.md stage 2 verifies against a Debug build first; flip to "true" for TestFlight/Release.
  APP_ATTEST_PRODUCTION = "false"
  # Attested keys + assertion counters, on the mounted volume below. Apple's replay defence is the
  # ever-increasing counter, which only works if it outlives the process.
  APP_ATTEST_DB_PATH = "/data/app-attest.db"

# Durable storage for the attested-key registry. One volume, one machine — see the scaling note in
# DEPLOY.md before raising the machine count.
[[mounts]]
  source = "attest_data"
  destination = "/data"
  initial_size = "1gb"

[http_service]
  internal_port = 8787
  force_https = true
  # ============================================================================
  # DO NOT SCALE ABOVE 1 until the challenge store and rate limiter are shared.
  # Both are per-process (in-memory): a second machine multiplies the rate limit
  # by the machine count and fails any request whose challenge was issued by the
  # other one. Scaling out requires a shared store (Redis) first — RULES.md §8.
  # ============================================================================
  # Keeping one machine warm is also deliberate: transcription latency sits directly in the
  # voice-capture path.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "5s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
